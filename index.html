<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting...</title>
    <script>
        const params = new URLSearchParams(window.location.search);
        let token = params.get('t') || window.location.hash.substring(1);

        if (token) {
            token = token.replace(/^\/+|\/+$/g, '');
            window.location.replace("https://eximtag.in/" + token + "/");
        } else {
            window.location.replace("https://eximtag.in/");
        }
    </script>
</head>
<body style="background:#0f172a; color:#f8fafc; font-family:sans-serif; display:flex; justify-content:center; align-items:center; height:100vh; margin:0;">
    <p>Opening review...</p>
</body>
</html>
